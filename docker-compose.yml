services:
  backend:
    build: ./backend
    container_name: backend-app
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - rabbitmq
    networks:
      - app_net

  frontend:
    build: ./frontend
    container_name: frontend-app
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - app_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "5000:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
